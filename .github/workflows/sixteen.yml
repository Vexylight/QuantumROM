name: QuantumROM Tools Sixteen

on:
  workflow_dispatch:
    inputs:
      STOCK_DEVICE:
        description: "STOCK_DEVICE_MODEL or None"
        required: true
        default: "SM-A346E"
      FIRMWARE_URL:
        description: "SamFW Direct Link"
        required: true
        default: ""
      TARGET_DEVICE:
        description: "TARGET_DEVICE_MODEL."
        required: true
        default: "SM-A346E"
      OUTPUT_FILESYSTEM:
        description: "OUTPUT_FILESYSTEM. e.g erofs / ext4"
        required: true
        default: "erofs"
      COMPRESS_IMG_TO_XZ:
        description: "Compress IMG to XZ (True/False)"
        required: true
        default: "False"

jobs:
  build:
    name: Start QuantumROM Tools Sixteen.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository.
        uses: actions/checkout@v4

      - name: Validate STOCK_DEVICE
        run: |
          STOCK_DEVICE="${{ github.event.inputs.STOCK_DEVICE }}"
          DEVICE_PATH="QuantumROM/Devices/$STOCK_DEVICE"
          if [ "$STOCK_DEVICE" != "None" ] && [ ! -d "$DEVICE_PATH" ]; then
            echo "❌ $STOCK_DEVICE is not supported with this tool."
            exit 1
          fi
          echo "✅ Validated STOCK_DEVICE: $STOCK_DEVICE"

      - name: Remove unnecessary files.
        uses: rokibhasansagar/slimhub_actions@v25.42.5

      - name: Install Dependencies.
        run: |
          sudo apt update
          sudo apt install -y p7zip-full lz4 liblz4-1 liblz4-dev libzstd1 libzstd-dev build-essential android-sdk-libsparse-utils f2fs-tools fuse2fs fuse e2fsprogs python3 python3-pip zipalign unzip openjdk-21-jdk jq perl xxd kmod erofs-utils linux-modules-extra-$(uname -r)
          sudo modprobe f2fs
          # samloader removed as per request
          mkdir -p FW WORK OUT

      - name: Download firmware
        run: |
          FIRMWARE_URL="${{ github.event.inputs.FIRMWARE_URL }}"
          if [ -z "$FIRMWARE_URL" ]; then
            echo "❌ Firmware URL is empty."
            exit 1
          fi
          
          echo "Downloading from: $FIRMWARE_URL"
          wget --content-disposition \
            --progress=bar:force:noscroll \
            "$FIRMWARE_URL" 2>&1
          
          FILENAME=$(ls -1t | head -1)
          if [ -z "$FILENAME" ]; then
            echo "❌ No file found after download."
            exit 1
          fi
          
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          echo "✅ Downloaded: $FILENAME ($(du -sh "$FILENAME" | cut -f1))"

      - name: Extract firmware
        run: |
          source scripts/QuantumRom.sh
          TARGET_DIR="FW/${{ github.event.inputs.TARGET_DEVICE }}"
          mkdir -p "$TARGET_DIR"
          mv "$FILENAME" "$TARGET_DIR/"
          
          echo "Extracting firmware in $TARGET_DIR..."
          EXTRACT_FIRMWARE "$TARGET_DIR"
          
          echo "✅ Firmware extraction complete."

      - name: Start Rom Build For ${{ github.event.inputs.STOCK_DEVICE }}
        run: |
          chmod +x sixteen.sh
          sudo bash sixteen.sh \
            "${{ github.event.inputs.STOCK_DEVICE }}" \
            "${{ github.event.inputs.TARGET_DEVICE }}" \
            "${{ github.event.inputs.OUTPUT_FILESYSTEM }}"

      - name: Compress all .img & make zip file before upload.
        run: |
          echo "BUILD_TIME=$(TZ='Asia/Dhaka' date '+%Y-%m-%d %I:%M:%S %p UTC+6')" >> $GITHUB_ENV
          OUT_DIR="$(pwd)/OUT"
          ZIP_NAME="${{ github.event.inputs.TARGET_DEVICE }}_Port_For_${{ github.event.inputs.STOCK_DEVICE }}.zip"
          ZIP_PATH="$OUT_DIR/$ZIP_NAME"

          # Check if OUT_DIR has content
          if [ -z "$(ls -A $OUT_DIR)" ]; then
            echo "❌ OUT_DIR is empty. Build likely failed."
            exit 1
          fi

          if [ "${{ github.event.inputs.COMPRESS_IMG_TO_XZ }}" = "True" ]; then
            echo "Compressing all .img files to .xz (level 9)..."
            for img in "$OUT_DIR"/*.img; do
              [ -f "$img" ] || continue
              echo "Compressing $img"
              sudo xz -9 -T0 "$img"
            done
            sudo rm -f "$OUT_DIR"/*.img
          fi

          echo "Creating zip: $ZIP_NAME"
          cd "$OUT_DIR"
          7z a -tzip "$ZIP_NAME" * -mx=5
          cd ..
          echo "ZIP_PATH=$ZIP_PATH" >> $GITHUB_ENV
          echo "✅ Zip created: $ZIP_PATH ($(du -sh "$ZIP_PATH" | cut -f1))"

      - name: Upload file in GoFile & Create Release.
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          STOCK_DEVICE: ${{ github.event.inputs.STOCK_DEVICE }}
          TARGET_DEVICE: ${{ github.event.inputs.TARGET_DEVICE }}
          OUTPUT_FILESYSTEM: ${{ github.event.inputs.OUTPUT_FILESYSTEM }}
          COMPRESS_IMG_TO_XZ: ${{ github.event.inputs.COMPRESS_IMG_TO_XZ }}
        run: |
           if [ -f release.sh ]; then
             chmod +x release.sh
             bash release.sh
           else
             echo "⚠️ release.sh not found. Skipping release step."
           fi
